<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentsPublic/head :: head('Registro Empresa')}"></head>
<body>
<div th:replace="~{fragmentsPublic/navbar :: navbar}"></div>

<div class="page-header">
    <h1>Registro de empresa</h1>

</div>
<main class="container">

    <section class="card">


        <form th:action="@{/Empresa/Registro}" method="post" class="form-layout">

            <div class="field">
                <label for="nombre">Nombre de la empresa</label>
                <input type="text" id="nombre" name="nombre" placeholder="Total Soft Inc." required>
            </div>

            <div class="field">
                <label for="localizacion">Localización</label>
                <input type="text" id="localizacion" name="localizacion" placeholder="San José, Curridabat" required>
            </div>

            <div class="field">
                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" name="correo" placeholder="info@bolsaempleo.local" required>
            </div>

            <div class="field">
                <label for="telefono">Teléfono</label>
                <input type="tel" id="telefono" name="telefono" placeholder="xxxx-xxxx" pattern="[0-9]{8}" title="Debe tener 8 dígitos" required>
            </div>

            <div class="field">
                <label for="descripcion">Descripción</label>
                <textarea id="descripcion" name="descripcion"></textarea>
            </div>

            <div class="actions">
                <button type="submit" class="btn btn-primary">Registrar</button>
                <a th:href="@{/}" class="btn btn-secondary">Cancelar</a>
            </div>

        </form>

    </section>

</main>
<div th:replace="~{fragmentsPublic/footer :: footer}"></div>

</body>
