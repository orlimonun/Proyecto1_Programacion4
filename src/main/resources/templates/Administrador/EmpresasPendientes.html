<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentsPublic/head :: head('Admin - Empresas Pendientes')}"></head>
<body>
<div th:replace="~{fragmentsAdmin/navbar :: navbar}"></div>

<div class="page-header">
    <h1>Administrador</h1>

</div>
<main class="actions">


    <div class="card">

        <table class="table">

            <thead>
            <tr>
                <th>Usuario</th>
                <th>Acción</th>

            </tr>
            </thead>

            <tbody>

            <tr th:if="${#lists.isEmpty(empresas)}">
                <td colspan="5">No hay empresas pendientes</td>
            </tr>

            <tr th:each="e : ${empresas}">

                <td th:text="${e.correo}"></td>

                <td class="actions">
                    <a class="btn btn-submit btn-sm" th:href="@{/admin/aceptarEmpresa}">Aprobar y generar clave</a>
                </td>

            </tr>

            </tbody>

        </table>

    </div>
</main>
<footer>
    <div th:replace="~{fragmentsPublic/footer :: footer}"></div>
</footer>
</body>
</html>
