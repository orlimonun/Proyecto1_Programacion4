<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentsPublic/head :: head('Admin - Características')}"></head>
<body>
<div th:replace="~{fragmentsAdmin/navbar :: navbar}"></div>

<div class="page-header">
    <h1>Características</h1>

</div>
<main class="container">

    <div class="carac-layout">

        <div class="green-card">

            <p><strong>Ruta:</strong></p>

            <div class="ruta">

                <span th:each="r, iter : ${ruta}">

                    <span class="badge" th:text="${r.nombre}"></span>

                    <span th:if="${!iter.last}">/</span>

                </span>

            </div>

            <p class="subtitulo">
                Subcategorías de:
                <strong ></strong><!------Agregar nombre de categorías--->
            </p>

            <div class="sub-list">
                <div class="caracteristicas">
                    <div class="sub-item"
                         th:each="sub : ${subcategorias}">

                        <span th:text="${sub.nombre}"></span>

                        <a class="btn btn-primary btn-sm"
                           th:href="@{/oferente/habilidades/{id}(id=${sub.id})}">
                            Entrar
                        </a>

                    </div>
                </div>
            </div>

        </div>


        <div class="green-card">

            <div class="container">

                <h2>Agregar característica</h2>


                <div class="card">

                    <form th:action="@{/admin/caracteristicas/guardar}" method="post" class="form-inline">


                        <input type="text" name="nombre" placeholder="Nueva característica" required>


                        <select name="padreId">
                            <option value="">(sin padre)</option>

                            <option th:each="p : ${listaPadres}"
                                    th:value="${p.id}"
                                    th:text="${p.nombre}">
                            </option>
                        </select>

                        <button type="submit" class="btn btn-primary">
                            Agregar
                        </button>

                    </form>

                </div>

                <div class="card">

                    <table class="table">
                        <thead>
                        <tr>
                            <th>Característica</th>
                            <th>Padre</th>
                        </tr>
                        </thead>

                        <tbody>
                        <tr th:each="c : ${caracteristicas}">

                            <td th:text="${c.nombre}">Nombre</td>

                            <td>
                                <select name="padreId">

                                    <option value="">(sin padre)</option>

                                    <option th:each="p : ${listaPadres}"
                                            th:value="${p.id}"
                                            th:text="${p.nombre}"
                                            th:selected="${c.padre != null and c.padre.id == p.id}">
                                    </option>

                                </select>
                            </td>

                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

</main>

<footer>
    <div th:replace="~{fragmentsPublic/footer :: footer}"></div>
</footer>
</body>
</html>
